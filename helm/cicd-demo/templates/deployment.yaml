apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-cicd-demo

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: cicd-demo

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}
